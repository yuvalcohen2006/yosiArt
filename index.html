<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3f1" />

    <!-- Bing Webmaster Tools site ownership. Verified by meta tag rather than
         DNS: the Google TXT record on the apex created a Search Console
         *Domain* property, which Bing's "import from GSC" flow does not see. -->
    <meta name="msvalidate.01" content="A5E3A63E63BEB849C8B857C135B0A35F" />
    <!-- <title> + <meta name="description"> are injected per-page by the
         <SEO /> component (react-helmet-async); leaving them out of
         index.html keeps the rendered HTML free of duplicates. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Artwork images and the painter's-world film both come from Sanity's
         asset CDN. Opening that connection during head parsing saves the
         DNS + TLS round trips before the video's first byte. -->
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@300;400;500;600;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Re-apply persisted accessibility preferences (a11y widget) before
         first paint, so returning visitors never see a flash of the
         non-adjusted page. Mirrors applyPrefs() in AccessibilityWidget. -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('yosiart.a11y') || '{}');
          var root = document.documentElement;
          if (p.contrast) root.classList.add('a11y-contrast');
          if (p.links) root.classList.add('a11y-links');
          if (p.stopMotion) root.classList.add('a11y-stop-motion');
          if (p.readable) root.classList.add('a11y-readable');
          var fs = Number(p.fontScale);
          if (fs > 100 && fs <= 150) root.style.fontSize = fs + '%';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
